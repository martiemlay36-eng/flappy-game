<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yılan</title>
<meta name="theme-color" content="#0f2027">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-wrapper">
  <canvas id="game-canvas"></canvas>

  <!-- HUD (skor) -->
  <div id="hud" class="hidden">
    <div id="score-display">0</div>
    <button id="pause-btn" title="Duraklat (P)">⏸</button>
  </div>

  <!-- MENÜ -->
  <div id="menu-screen" class="overlay">
    <button id="back-to-hub-btn" class="back-btn">← Salon</button>
    <h1 class="game-title">🐍 YILAN</h1>
    <p class="tagline">Yön tuşları veya kaydırma — elma ye, büyü, duvara çarpma!</p>

    <div class="difficulty-tabs">
      <button class="diff-btn" data-diff="easy">Yavaş</button>
      <button class="diff-btn active" data-diff="normal">Normal</button>
      <button class="diff-btn" data-diff="fast">Hızlı</button>
    </div>

    <button id="start-btn" class="big-btn">▶ BAŞLA</button>
    <button id="mp-btn" class="small-btn mp-open-btn">🌐 Çevrimiçi Düello</button>
    <div id="best-score-display">🏆 Rekor: 0</div>
  </div>

  <!-- ÇEVRİMİÇİ DÜELLO -->
  <div id="mp-screen" class="overlay hidden">
    <h2 class="go-title" style="color:#00bfff">🌐 YILAN DÜELLOSU</h2>
    <p class="tagline">Aynı haritada yarışın — kim daha uzun yaşayacak?</p>

    <div id="mp-lobby" class="mp-panel">
      <div class="menu-row mp-btn-row" id="mp-btn-row">
        <button id="mp-host-btn" class="big-btn">🏠 Oda Kur</button>
        <button id="mp-join-btn" class="big-btn">🔗 Kodla Katıl</button>
      </div>

      <div id="mp-host-area" class="hidden">
        <div class="mp-code-box">
          <span>Oda Kodu:</span>
          <span id="mp-room-code" class="mp-code">-----</span>
        </div>
        <p class="tagline" id="mp-wait-text">Arkadaşın bekleniyor...</p>
        <div class="mp-loader"></div>
      </div>

      <div id="mp-join-area" class="hidden">
        <input id="mp-code-input" maxlength="5" placeholder="5 haneli kod" class="mp-code-input" autocomplete="off">
        <button id="mp-join-confirm" class="big-btn">Katıl</button>
        <p class="tagline" id="mp-join-status"></p>
      </div>

      <p class="tagline" id="mp-error" style="color:#ff7b7b"></p>
      <button id="mp-quit-btn" class="small-btn">← Vazgeç</button>
    </div>
  </div>

  <!-- Düello sonu -->
  <div id="mp-gameover-screen" class="overlay hidden">
    <h2 class="go-title">🏁 DÜELLO BİTTİ</h2>
    <div class="score-panel">
      <div class="score-row"><span id="mp-me-label">Sen</span><span id="mp-final-me">0</span></div>
      <div class="score-row"><span id="mp-opp-label">Rakip</span><span id="mp-final-opp">0</span></div>
      <div id="mp-result-text"></div>
    </div>
    <div class="menu-row">
      <button id="mp-rematch-btn" class="big-btn">🔄 Rövanş</button>
      <button id="mp-leave-btn" class="small-btn">🏠 Menü</button>
    </div>
  </div>

  <!-- OYUN BİTTİ -->
  <div id="gameover-screen" class="overlay hidden">
    <h2 class="go-title">OYUN BİTTİ</h2>

    <div class="score-panel">
      <div class="score-row"><span>Skor</span><span id="final-score">0</span></div>
      <div class="score-row"><span>Rekor</span><span id="best-score-go">0</span></div>
      <div id="new-record" class="hidden">🎉 YENİ REKOR!</div>
    </div>

    <div class="menu-row">
      <button id="retry-btn" class="big-btn">🔄 TEKRAR</button>
      <button id="home-btn" class="small-btn">🏠 Salon</button>
    </div>
  </div>

  <!-- DURAKLAT -->
  <div id="pause-screen" class="overlay hidden">
    <h2>DURAKLATILDI</h2>
    <div class="menu-row">
      <button id="resume-btn" class="big-btn">▶ Devam</button>
      <button id="quit-btn" class="small-btn">🏠 Salon</button>
    </div>
  </div>

  <!-- İpucu -->
  <div id="tap-hint" class="hidden">👆 Kaydır / Yön tuşları</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="snake.js"></script>
</body>
</html>
